[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["HAKUMI", "katsumi143 <32640219+katsumi143@users.noreply.github.com>"]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
homepage = "https://github.com/hakusoda/ribbon"
repository = "https://github.com/hakusoda/ribbon"
rust-version = "1.91"

[workspace.dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.48.0", features = ["full"] }
starlight = { path = "../../hakusoda/starlight/crates/starlight" }

[profile.dev]
lto = false
debug = true
rpath = false
panic = "unwind"
opt-level = 0
incremental = true
codegen-units = 256
overflow-checks = true
debug-assertions = true

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = 3
incremental = false
codegen-units = 1
debug-assertions = false