[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["HAKUMI", "katsumi143 <32640219+katsumi143@users.noreply.github.com>"]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
homepage = "https://github.com/hakusoda/ribbon"
repository = "https://github.com/hakusoda/ribbon"
rust-version = "1.91"

[workspace.dependencies]
actix-web = "4.12.0"
async-once-cell = "0.5.4"
base64 = "0.22.1"
chrono = "0.4.42"
dotenvy = "0.15.7"
dashmap = { version = "6.1.0", features = ["inline"] }
futures = "0.3.31"
jsonwebtoken = "10.2.0"
log = "0.4.28"
once_cell = "1.21.3"
p384 = "0.13.1"
rand = "0.9.2"
reqwest = "0.12.24"
rustls = { version = "0.23.35", features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-aux = "4.7.0"
serde_json = "1.0.145"
serde_repr = "0.1.20"
sqlx = { version = "0.8.6", features = ["uuid", "json", "chrono", "macros", "postgres", "tls-native-tls", "rust_decimal", "runtime-tokio"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
twilight-http = { version = "0.17.0", features = ["simd-json"] }
twilight-gateway = { version = "0.17.0", features = ["simd-json"] }
twilight-model = { version = "0.17.0" }
twilight-util = { version = "0.17.0", features = ["builder"] }
urlencoding = "2.1.3"
uuid = "1.11.0"
validator = "0.20.0"
starlight = { path = "../../hakusoda/starlight/crates/starlight" }

[profile.dev]
lto = false
debug = true
rpath = false
panic = "unwind"
opt-level = 0
incremental = true
codegen-units = 256
overflow-checks = true
debug-assertions = true

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = 3
incremental = false
codegen-units = 1
debug-assertions = false